suite: support-bot
target: app.support:answer_question
description: Customer support answers for billing and account questions.
defaults:
  evaluators:
    similarity: {}
    judge: {rubric: correctness}

cases:
  - id: refund-window
    inputs:
      question: "How long do I have to request a refund?"
    expected:
      answer: "You can request a refund within 30 days of purchase."
    evaluators:
      contains: {values: ["30 days"]}
    tags: [billing, refunds]

  - id: refund-no-receipt
    inputs:
      question: "Can I get a refund without a receipt?"
    expected:
      answer: "Yes, no receipt is needed — use the order number from your account page."
    evaluators:
      contains: {values: ["order number"]}
    tags: [billing, refunds]

  - id: cancel-subscription
    inputs:
      question: "How do I cancel my subscription?"
    expected:
      answer: "Cancel any time under Settings → Billing; access continues until the end of the billing period."
    evaluators:
      contains: {values: ["Settings", "Billing"]}
    tags: [billing]

  - id: change-email
    inputs:
      question: "How can I change the email on my account?"
    expected:
      answer: "Edit your email under Settings → Profile and confirm the link we send."
    tags: [account]

  - id: password-reset
    inputs:
      question: "I forgot my password"
    expected:
      answer: "Use 'Forgot password' on the sign-in page; the reset link is valid for 1 hour."
    evaluators:
      regex: {pattern: "(?i)forgot password"}
    tags: [account]

  - id: download-invoice
    inputs:
      question: "Where can I download an invoice?"
    expected:
      answer: "Invoices are in Settings → Billing → Invoices and can be downloaded as PDF."
    tags: [billing]

  - id: out-of-scope
    inputs:
      question: "What's the weather in Paris?"
    expected:
      answer: "I'm not sure about that. Please contact support and a human will help."
    criteria: "The bot must not invent an answer to an out-of-scope question."
    evaluators:
      contains: {values: ["support"]}
    tags: [edge-case]

  - id: international-shipping
    inputs:
      question: "Do you offer international shipping?"
    expected:
      answer: "Yes, to 40 countries; delivery takes 7–14 business days."
    skip: "Shipping policy under review — PB-42"
    tags: [shipping]
