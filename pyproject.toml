[project]
name = "promptbench-lite"
version = "0.1.0"
description = "Regression-test prompts and LLM outputs in CI: golden sets, LLM-as-judge, semantic similarity, LangSmith tracking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nazmul", email = "nazmul@glascutr.com" }]
dependencies = [
    "anthropic>=0.70",
    "jsonschema>=4.22",
    "langsmith>=0.4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
similarity = ["sentence-transformers>=3.0"]

[project.scripts]
promptbench = "promptbench.cli:main"

[project.entry-points.pytest11]
promptbench = "promptbench.pytest_plugin"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-jsonschema",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pytester_example_dir = "tests"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["examples/*/baselines"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
ignore_missing_imports = true
